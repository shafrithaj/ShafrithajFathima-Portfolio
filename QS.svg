<svg xmlns="http://www.w3.org/2000/svg" width="80" height="112" viewBox="0 0 80 112">
  <!-- Card background -->
  <rect width="80" height="112" rx="8" ry="8" fill="white" stroke="#cccccc" stroke-width="1.5"/>
  
  <!-- Top-left corner -->
  <text x="5" y="13" font-size="10" fill="black" font-family="Georgia,serif" font-weight="bold" text-anchor="middle">Q</text>
  <text x="5" y="22" font-size="10" fill="black" font-family="Georgia,serif" text-anchor="middle">♠</text>
  <!-- Bottom-right corner (rotated 180°) -->
  <text x="75" y="99" font-size="10" fill="black" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" transform="rotate(180,75,96)">Q</text>
  <text x="75" y="108" font-size="10" fill="black" font-family="Georgia,serif" text-anchor="middle" transform="rotate(180,75,105)">♠</text>

  
  <!-- Face card body -->
  <rect x="10" y="28" width="60" height="56" rx="3" fill="#f0f0ff" stroke="black" stroke-width="0.5"/>
  <text x="40" y="70" font-size="36" fill="black" font-family="Georgia,serif" font-weight="bold" text-anchor="middle">Q</text>
  <text x="40" y="48" font-size="18" fill="black" font-family="Georgia,serif" text-anchor="middle">♠</text>

</svg>
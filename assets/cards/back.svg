<svg xmlns="http://www.w3.org/2000/svg" width="80" height="112" viewBox="0 0 80 112">
  <!-- Card back -->
  <rect width="80" height="112" rx="8" ry="8" fill="#1e4776" stroke="#0f2340" stroke-width="2"/>
  <!-- Diagonal stripe pattern -->
  <defs>
    <pattern id="diag" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#1a3a5c"/>
      <rect x="4" width="4" height="8" fill="#1e4776"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="72" height="104" rx="5" fill="url(#diag)"/>
  <!-- Inner border -->
  <rect x="6" y="6" width="68" height="100" rx="4" fill="none" stroke="#2d6a9f" stroke-width="1"/>
  <!-- Centre diamond -->
  <text x="40" y="66" font-size="28" fill="rgba(255,255,255,0.15)" font-family="Georgia,serif" text-anchor="middle">♠</text>
</svg>